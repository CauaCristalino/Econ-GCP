name: Gemini Review

# Revisão de código por IA nos pull requests, com uma única chamada à API do Gemini por revisão.
# Roda quando um PR é aberto e quando alguém com acesso de escrita comenta "@gemini-cli /review".
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

concurrency:
  group: gemini-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    # PRs de forks ficam de fora: eles não recebem o secret e não devem gastar a cota.
    # No gatilho por comentário, só quem tem acesso de escrita ao repositório dispara a revisão.
    if: >-
      (github.event_name == 'pull_request'
        && github.event.pull_request.draft == false
        && github.event.pull_request.head.repo.fork == false)
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && startsWith(github.event.comment.body, '@gemini-cli /review')
        && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
    steps:
      # Sem "ref": no gatilho por comentário o script vem sempre do main, nunca do branch do PR.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Baixar o diff do PR
        run: gh pr diff "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/pr.diff"

      - name: Pedir a revisão ao Gemini
        run: python3 .github/scripts/gemini_review.py "$RUNNER_TEMP/pr.diff" "$RUNNER_TEMP/revisao.md"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Opcional: defina a variável GEMINI_MODEL no repositório para trocar de modelo.
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}

      - name: Publicar a revisão no PR
        run: |
          if [ -s "$RUNNER_TEMP/revisao.md" ]; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/revisao.md"
          fi
