name: CI

# Valida todo PR e todo push no main: lint, formatação, tipos e testes.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingestion/requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r ingestion/requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Formatação (ruff format)
        run: ruff format --check .

      - name: Tipos (mypy)
        run: mypy ingestion/src

      - name: Testes (pytest)
        run: pytest
